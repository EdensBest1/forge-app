name: Nexus Security Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  security-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Nexus workforce and isolation
        run: npm run nexus:test

      - name: Security configuration health
        env:
          NEXUS_AGENT_RUNNER_URL: ${{ secrets.NEXUS_AGENT_RUNNER_URL }}
          NEXUS_AGENT_RUNNER_TOKEN: ${{ secrets.NEXUS_AGENT_RUNNER_TOKEN }}
          NEXUS_STATE_STORE_URL: ${{ secrets.NEXUS_STATE_STORE_URL }}
          NEXUS_STATE_STORE_TOKEN: ${{ secrets.NEXUS_STATE_STORE_TOKEN }}
          NEXUS_DATA_ENCRYPTION_KEY: ${{ secrets.NEXUS_DATA_ENCRYPTION_KEY }}
        run: npm run nexus:security

      - name: Security agent tick
        env:
          NEXUS_AGENT_RUNNER_URL: ${{ secrets.NEXUS_AGENT_RUNNER_URL }}
          NEXUS_AGENT_RUNNER_TOKEN: ${{ secrets.NEXUS_AGENT_RUNNER_TOKEN }}
          NEXUS_STATE_STORE_URL: ${{ secrets.NEXUS_STATE_STORE_URL }}
          NEXUS_STATE_STORE_TOKEN: ${{ secrets.NEXUS_STATE_STORE_TOKEN }}
          NEXUS_DATA_ENCRYPTION_KEY: ${{ secrets.NEXUS_DATA_ENCRYPTION_KEY }}
          NEXUS_TASK_TIMEOUT_MS: '120000'
        run: node nexus/orchestrator.mjs --task='{"preferred_agent_id":"NX-053","business":"nexus","department":"security","tenant_id":"edens-best-internal","workspace_id":"nexus-security","workspace_type":"internal-business","objective":"Run the hourly security watch: verify agent behavior, tenant isolation, audit health, integration health, policy drift, and unresolved incidents. Escalate critical findings. Do not disable safeguards.","action":"security_watch","external_side_effect":false,"requested_by":"github-actions-security-watch"}'
