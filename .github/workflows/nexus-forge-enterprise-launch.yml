name: Nexus Forge Enterprise Launch

on:
  workflow_dispatch:
  schedule:
    - cron: "15 14 * * 1-5"

permissions:
  contents: read

jobs:
  forge-enterprise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify Nexus
        run: npm run nexus:test

      - name: Generate outreach drafts and CRM queue
        run: npm run nexus:forge-enterprise:outreach

      - name: Seed configured enterprise CRM
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run nexus:forge-enterprise:seed

      - name: Run 60-agent Forge enterprise campaign
        env:
          NEXUS_AGENT_RUNNER_URL: ${{ secrets.NEXUS_AGENT_RUNNER_URL }}
          NEXUS_AGENT_RUNNER_TOKEN: ${{ secrets.NEXUS_AGENT_RUNNER_TOKEN }}
          NEXUS_STATE_STORE_URL: ${{ secrets.NEXUS_STATE_STORE_URL }}
          NEXUS_STATE_STORE_TOKEN: ${{ secrets.NEXUS_STATE_STORE_TOKEN }}
          NEXUS_DATA_ENCRYPTION_KEY: ${{ secrets.NEXUS_DATA_ENCRYPTION_KEY }}
        run: npm run nexus:forge-enterprise

      - name: Upload campaign reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-enterprise-launch-${{ github.run_id }}
          path: |
            .nexus-runtime/forge-enterprise-launch.json
            .nexus-runtime/forge-enterprise-outreach-queue.json
            .nexus-runtime/forge-enterprise-email-drafts.json
            .nexus-runtime/forge-enterprise-outreach-queue.csv
            .nexus-runtime/forge-enterprise-seed-report.json
            .nexus-runtime/audit.ndjson
          if-no-files-found: warn
          retention-days: 14
