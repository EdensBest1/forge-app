<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" />
    <title>Forge is offline</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #fff; color: #132033; }
      main { width: min(34rem, calc(100% - 2rem)); }
      p { color: #5a687b; line-height: 1.65; }
      button { min-height: 48px; border: 0; border-radius: 12px; background: #1657c8; color: #fff; padding: 0 20px; font: inherit; font-weight: 800; }
      button:focus-visible { outline: 3px solid #f56d23; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p>Forge · Medford and Southern Oregon</p>
      <h1>You’re offline right now.</h1>
      <p>Reconnect and try again. Requests saved in this browser remain on this device; this screen does not mean anything was delivered to Forge.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
