<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monetization Admin</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      body { background: #f5f8fc; color: #0b1633; font-family: Inter, system-ui, sans-serif; margin: 0; }
      main { padding: 28px; display: grid; gap: 18px; }
      table { width: 100%; border-collapse: collapse; background: white; }
      th, td { border: 1px solid #d7e0ec; padding: 8px; text-align: left; vertical-align: top; }
      th { background: #003da5; color: white; }
      .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
      .metrics article { background: white; border: 1px solid #d7e0ec; border-radius: 8px; padding: 14px; }
    </style>
  </head>
  <body>
    <main>
      <a href="/">Back to Forge</a>
      <h1>Monetization Admin</h1>
      <p>Static/admin-gated configuration view. Prices, boosts, caps, and ranking multipliers are source-controlled until a protected backend admin editor exists.</p>
      <section class="metrics" id="metrics"></section>
      <table id="tierTable"></table>
      <table id="addOnTable"></table>
    </main>
    <script type="module">
      import { addOns, formatPrice, planTiers } from "/monetization/monetization-config.mjs";
      const activePlans = planTiers.filter((plan) => plan.active);
      const monthlyMrr = activePlans.reduce((sum, plan) => sum + plan.monthlyPriceCents, 0);
      document.querySelector("#metrics").innerHTML = `
        <article><strong>${activePlans.length}</strong><span> Active tiers</span></article>
        <article><strong>${addOns.filter((item) => item.active).length}</strong><span> Active add-ons</span></article>
        <article><strong>${formatPrice(monthlyMrr)}</strong><span> One-each projected MRR</span></article>
      `;
      document.querySelector("#tierTable").innerHTML = `
        <thead><tr><th>App</th><th>Tier</th><th>Monthly</th><th>Annual/package</th><th>Rank</th><th>Boosts</th><th>Verification</th><th>Active</th></tr></thead>
        <tbody>${planTiers.map((plan) => `<tr><td>${plan.app}</td><td>${plan.name}</td><td>${formatPrice(plan.monthlyPriceCents)}</td><td>${formatPrice(plan.annualPriceCents)}</td><td>${plan.rankingMultiplier}</td><td>${plan.boostCreditsPerMonth}</td><td>${plan.verificationIncluded ? "yes" : "no"}</td><td>${plan.active ? "yes" : "no"}</td></tr>`).join("")}</tbody>
      `;
      document.querySelector("#addOnTable").innerHTML = `
        <thead><tr><th>App</th><th>Add-on</th><th>Type</th><th>Price</th><th>Terms</th></tr></thead>
        <tbody>${addOns.map((item) => `<tr><td>${item.app}</td><td>${item.name}</td><td>${item.type}</td><td>${formatPrice(item.priceCents)}</td><td>${item.termsDisclaimer}</td></tr>`).join("")}</tbody>
      `;
    </script>
  </body>
</html>
